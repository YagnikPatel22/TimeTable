<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ephemeral — Back shortly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --fg:#F3ECDD; --line: rgba(243,236,221,0.14);
    --muted: rgba(243,236,221,0.55); --brass:#B8894F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--fg); font-family:'Jost', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{width:100%; max-width:460px; text-align:center;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--muted); margin:0 0 20px;
  }
  h1{
    font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500;
    font-size:clamp(38px,8vw,58px); line-height:1.05; margin:0 0 18px;
  }
  .msg{font-family:'Jost'; font-size:14.5px; color:var(--muted); line-height:1.6; margin:0 0 32px;}
  .line{position:relative; height:1px; background:var(--line); overflow:hidden; margin-bottom:32px;}
  .line::after{
    content:''; position:absolute; top:0; left:-30%; width:30%; height:100%; background:var(--brass);
    animation:shimmer 2.6s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{left:-30%;} 50%{left:100%;} 100%{left:100%;} }
  .dots{display:flex; gap:6px; justify-content:center; margin-bottom:30px;}
  .dot{width:5px; height:5px; border-radius:50%; background:var(--muted); animation:pulse 1.4s ease-in-out infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes pulse{ 0%,100%{opacity:.25; transform:scale(1);} 50%{opacity:1; transform:scale(1.3);} }
  .foot{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); letter-spacing:.05em;}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Ephemeral / Schedule</p>
    <h1>Back in a moment</h1>
    <p class="msg">Making a few things better behind the scenes. Won't be long.</p>
    <div class="line"></div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <p class="foot">— Yagnik N.</p>
  </div>
</body>
</html>
